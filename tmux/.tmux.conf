# wl-clipboard shenanigans
set -g set-clipboard on
set -s copy-command 'wl-copy'
# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0
# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000
# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

set -as terminal-features ',*:clipboard'

# set -g default-terminal "tmux-256color"
# set -as terminal-features ",xterm-256color:RGB"
# set -g default-terminal "tmux-256color"
# set -as terminal-features ",*:RGB"

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g update-environment "WAYLAND_DISPLAY"

# follow hyperlinks in tmux
set -ga terminal-features "*:hyperlinks"

# set prefix keybind
unbind C-b 
set -g prefix C-a
bind C-a send-prefix

# scrolling
setw -g mouse on
setw -g mode-keys vi

# presenterm images
set -gq allow-passthrough on
set -g visual-activity off

# bind-key space next-window
# bind-key bspace previous-window
# bind-key enter next-layout

# open panes in current directory. 
bind-key -n M-s split-window -h -c "#{pane_current_path}"
bind-key -n M-v split-window -v -c "#{pane_current_path}"

# vi-bindings for navigation
bind -n M-h select-pane -L
bind -n M-k select-pane -U
bind -n M-j select-pane -D
bind -n M-l select-pane -R

bind -n M-z resize-pane -Z

# bind-key a last-pane
# bind-key q display-panes
# bind-key c new-window
# bind-key t next-window
# bind-key T previous-window

# Change the keybinding  from 'prefix + [' to 'prefix + v'
bind -n M-Enter copy-mode

# setup 'v' to begin selection as in Vim
# Update default binding of `Enter` to also use copy-pipe
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection

bind P paste-buffer

# toggle tmux key handling off/on
bind -T root M-o {
  set prefix None
  set key-table off
  set status-style "fg=colour245,bg=colour238"
  refresh-client -S
}

bind -T off M-o {
  set -u prefix
  set -u key-table
  set -u status-style
  refresh-client -S
}

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @continuum-restore 'on'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'

set -g @dracula-show-fahrenheit false
set -g @dracula-show-location false
set -g @dracula-show-timezone false
set -g @dracula-show-empty-plugins false

set -g @dracula-plugins "battery network weather"
set -g @dracula-show-left-icon session

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
